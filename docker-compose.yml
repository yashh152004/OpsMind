version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: opsmind-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-opsmind}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_HOST: "%"
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - opsmind-network

  # Prometheus (Metrics backend)
  prometheus:
    image: prom/prometheus:latest
    container_name: opsmind-prometheus
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - opsmind-network

  # Jaeger (Traces backend)
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: opsmind-jaeger
    ports:
      - "16686:16686" # Web UI / Query REST API
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - opsmind-network

  # Loki (Logs backend)
  loki:
    image: grafana/loki:latest
    container_name: opsmind-loki
    volumes:
      - ./infrastructure/loki/loki-config.yaml:/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - opsmind-network

  # OpenTelemetry Collector (Telemetry Pipeline)
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: opsmind-otel-collector
    volumes:
      - ./infrastructure/otel/otel-collector-config.yaml:/etc/otel-collector/config.yaml
    command: ["--config=/etc/otel-collector/config.yaml"]
    ports:
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver
      - "8889:8889" # Prometheus metrics exporter (internal)
    depends_on:
      - prometheus
      - jaeger
      - loki
    networks:
      - opsmind-network

volumes:
  mysql_data:

networks:
  opsmind-network:
    driver: bridge
